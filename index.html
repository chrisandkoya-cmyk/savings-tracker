<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบออมเงิน</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js" onerror=""></script>
<style>
  :root{
    --background:#0f172a;--card:#1e293b;--border:#334155;
    --foreground:#f8fafc;--muted-foreground:#94a3b8;
    --primary:#38bdf8;--primary-foreground:#0f172a;
    --secondary:#334155;--secondary-foreground:#f1f5f9;
    --success:#22c55e;--warning:#f59e0b;--error:#ef4444;
    --chart-1:#38bdf8;--chart-2:#a855f7;
  }
  @media (prefers-color-scheme: light){
    :root{
      --background:#f8fafc;--card:#ffffff;--border:#e2e8f0;
      --foreground:#0f172a;--muted-foreground:#64748b;
      --primary:#0284c7;--primary-foreground:#ffffff;
      --secondary:#f1f5f9;--secondary-foreground:#1e293b;
      --success:#16a34a;--warning:#d97706;--error:#dc2626;
      --chart-1:#0284c7;--chart-2:#9333ea;
    }
  }
  body{background:var(--background);color:var(--foreground);font-family:system-ui,-apple-system,sans-serif;margin:0}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px}
  .inp{background:var(--background);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;color:var(--foreground);box-sizing:border-box}
  .inp:focus{outline:2px solid var(--primary);outline-offset:-1px}
  .btn{background:var(--primary);color:var(--primary-foreground);border-radius:8px;padding:8px 14px;font-weight:600;border:0;cursor:pointer}
  .btn2{background:var(--secondary);color:var(--secondary-foreground);border-radius:8px;padding:6px 12px;font-size:12px;border:0;cursor:pointer}
  .btn:hover,.btn2:hover{opacity:.88}
  .muted{color:var(--muted-foreground)}
</style>
</head>
<body class="antialiased">
<div class="max-w-3xl mx-auto p-4 md:p-6 space-y-4">

  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold">🐷 ระบบออมเงิน</h1>
      <p class="muted text-sm">ต่อยอดจากโค้ดหายอดรวม / ค่าเฉลี่ย / ค่าสูงสุด</p>
    </div>
    <button class="btn2" onclick="resetAll()">🗑 เริ่มใหม่</button>
  </div>

  <!-- 1. ตั้งเป้าหมายการออม -->
  <div class="card p-4 space-y-3">
    <h2 class="font-semibold">1. ตั้งเป้าหมายการออม</h2>
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex-1 min-w-[160px] text-xs muted">จำนวนเงินเป้าหมาย (บาท)
        <input id="goalInput" type="number" min="1" class="inp mt-1 text-sm" placeholder="เช่น 5000">
      </label>
      <button class="btn text-sm" onclick="setGoal()">ตั้งเป้าหมาย</button>
    </div>
  </div>

  <!-- 2. บันทึกเงินออม (ลูป N รอบเหมือนโค้ดครู) -->
  <div class="card p-4 space-y-3">
    <h2 class="font-semibold">2. บันทึกเงินออม</h2>
    <label class="text-xs muted block">กรอกจำนวนสัปดาห์ (N)
      <input id="nWeeks" type="number" min="1" max="52" value="1" class="inp mt-1 text-sm" oninput="buildInputs()">
    </label>
    <div id="weekInputs" class="space-y-2 max-h-60 overflow-auto pr-1"></div>
    <button class="btn w-full text-sm" onclick="addSavings()">บันทึกเงินออม</button>
    <p id="msg" class="text-xs"></p>
  </div>

  <!-- 3. สรุปผลการออม -->
  <div class="card p-4 space-y-4">
    <h2 class="font-semibold">3. สรุปผลการออม</h2>
    <div id="summary" class="grid sm:grid-cols-3 gap-3"></div>
    <div id="goalBox"></div>
  </div>

  <p class="muted text-xs text-center">เวอร์ชัน Dev-C++ ดูไฟล์ <a href="savings_tracker.c" class="underline">savings_tracker.c</a></p>
</div>

<script>
/* ตัวแปรเดียวกับในโค้ด C */
let goal = 0, weekCount = 0, total = 0, highest = 0, hiWeek = 0;
const KEY = "savings-simple-v1";
const fmt = n => n.toLocaleString("th-TH", {minimumFractionDigits: 2, maximumFractionDigits: 2});

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({goal, weekCount, total, highest, hiWeek})); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d){ ({goal=0, weekCount=0, total=0, highest=0, hiWeek=0} = d); }
  }catch(e){}
}

/* เมนู 1: ตั้งเป้าหมาย */
function setGoal(){
  const v = parseFloat(document.getElementById("goalInput").value);
  if(!(v >= 1)) return flash("กรุณากรอกจำนวนเงินเป้าหมายให้ถูกต้อง", true);
  goal = v; save(); render();
  flash(`ตั้งเป้าหมาย ${fmt(goal)} บาท เรียบร้อย!`);
}

/* เมนู 2: รับค่า N รอบ -> total += amount, if (amount > highest) */
function buildInputs(){
  let N = Math.min(52, Math.max(1, parseInt(document.getElementById("nWeeks").value) || 1));
  let html = "";
  for(let i = 1; i <= N; i++){
    html += `<label class="flex items-center gap-2 text-xs muted">
      <span class="w-28 shrink-0">เงินออมสัปดาห์ที่ ${weekCount + i}</span>
      <input type="number" min="0" class="inp text-sm wk" placeholder="0.00"></label>`;
  }
  document.getElementById("weekInputs").innerHTML = html;
}
function addSavings(){
  const inputs = [...document.querySelectorAll(".wk")];
  for(const el of inputs){
    if(el.value === "" || !(parseFloat(el.value) >= 0)){
      el.focus(); return flash("กรุณากรอกจำนวนเงินให้ครบทุกสัปดาห์", true);
    }
  }
  for(const el of inputs){
    const amount = parseFloat(el.value);
    weekCount++;
    total += amount;
    if(amount > highest){ highest = amount; hiWeek = weekCount; }
  }
  save();
  document.getElementById("nWeeks").value = 1;
  render();
  flash(`บันทึก ${inputs.length} สัปดาห์เรียบร้อย!`);
}

function resetAll(){
  if(!confirm("ต้องการเริ่มใหม่และล้างข้อมูลทั้งหมดใช่ไหม?")) return;
  goal = 0; weekCount = 0; total = 0; highest = 0; hiWeek = 0;
  save(); render();
}
function flash(t, err){
  const m = document.getElementById("msg");
  m.textContent = t; m.style.color = err ? "var(--error)" : "var(--success)";
  setTimeout(() => m.textContent = "", 3000);
}
function stat(label, value, sub, color){
  return `<div class="rounded-xl p-3" style="border:1px solid var(--border)">
    <div class="text-xs muted">${label}</div>
    <div class="text-xl font-bold tabular-nums" style="color:${color}">${value}</div>
    <div class="text-xs muted">${sub}</div></div>`;
}

/* เมนู 3: สรุปผล */
function render(){
  document.getElementById("goalInput").value = goal || "";
  if(weekCount === 0){
    document.getElementById("summary").innerHTML = `<p class="muted text-sm sm:col-span-3">ยังไม่มีข้อมูลการออม</p>`;
  } else {
    const average = total / weekCount;
    document.getElementById("summary").innerHTML =
      stat("ยอดออมรวม", fmt(total) + " บาท", `ออมแล้ว ${weekCount} สัปดาห์`, "var(--chart-1)") +
      stat("เฉลี่ยต่อสัปดาห์", fmt(average) + " บาท", "ยอดรวม ÷ จำนวนสัปดาห์", "var(--chart-2)") +
      stat("ออมมากที่สุด", fmt(highest) + " บาท", `สัปดาห์ที่ ${hiWeek}`, "var(--success)");
  }

  let g = "";
  if(goal > 0){
    const remaining = goal - total, percent = Math.min(100, total / goal * 100);
    const average = weekCount ? total / weekCount : 0;
    let note;
    if(remaining <= 0) note = `<span style="color:var(--success)" class="font-semibold">🎉 ยินดีด้วย! ออมครบเป้าหมายแล้ว!</span>`;
    else if(average > 0) note = `ยังขาดอีก <b>${fmt(remaining)} บาท</b> · คาดว่าจะครบใน <b>${Math.ceil(remaining / average)} สัปดาห์</b>`;
    else note = `ยังขาดอีก <b>${fmt(remaining)} บาท</b>`;
    g = `<div class="pt-3" style="border-top:1px solid var(--border)">
      <div class="flex justify-between text-sm mb-1"><span>🎯 เป้าหมาย: <b>${fmt(goal)} บาท</b></span><span class="tabular-nums font-semibold">${percent.toFixed(1)}%</span></div>
      <div class="h-3 rounded-full overflow-hidden" style="background:var(--secondary)">
        <div class="h-full rounded-full transition-all" style="width:${percent}%;background:${percent>=100?'var(--success)':'var(--primary)'}"></div></div>
      <p class="text-xs muted mt-2">${note}</p></div>`;
  }
  document.getElementById("goalBox").innerHTML = g;
  buildInputs();
}

load();
render();
</script>
</body>
</html>
