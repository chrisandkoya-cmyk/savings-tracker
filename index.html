<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ระบบออมเงิน · Savings Tracker</title>
<meta name="description" content="ระบบออมเงิน ต่อยอดจากโค้ดภาษา C คำนวณยอดรวม ค่าเฉลี่ย และค่าสูงสุด พร้อมติดตามเป้าหมาย">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6f4;
    --surface: #ffffff;
    --surface-2: #eef2ef;
    --border: #dde5e0;
    --text: #11201a;
    --muted: #5d6e66;
    --accent: #0f766e;
    --accent-hover: #0d655e;
    --accent-soft: #d1fae5;
    --accent-text: #065f46;
    --gold: #b45309;
    --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1512;
      --surface: #13211c;
      --surface-2: #1b2d27;
      --border: #253b33;
      --text: #ecfdf5;
      --muted: #8da59b;
      --accent: #14b8a6;
      --accent-hover: #2dd4bf;
      --accent-soft: #133933;
      --accent-text: #5eead4;
      --gold: #fbbf24;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Prompt", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .app {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent-soft); display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
  }
  h1 { font-size: 1.05rem; font-weight: 700; margin: 0; line-height: 1.2; }
  .sub { font-size: .7rem; color: var(--muted); margin: 0; }
  .ghost-btn {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 8px; font: inherit; font-size: .74rem; cursor: pointer;
    flex-shrink: 0;
  }
  .ghost-btn:hover { color: var(--danger); border-color: var(--danger); }

  /* Hero + 3 stats inside one compact block */
  .hero {
    background: linear-gradient(135deg, #0f766e 0%, #064e3b 100%);
    color: #ecfdf5; border-radius: 16px; padding: 14px;
    box-shadow: 0 8px 20px rgba(15, 118, 110, .2);
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hero-label { font-size: .72rem; opacity: .82; }
  .hero-total {
    font-size: 1.55rem; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1.15; word-break: break-word;
  }
  .hero-total small { font-size: .85rem; font-weight: 500; opacity: .85; }
  .pill {
    background: rgba(255,255,255,.16); padding: 3px 9px; border-radius: 999px;
    font-size: .72rem; white-space: nowrap; flex-shrink: 0;
  }

  /* 3 summary stats row inside hero */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    margin-top: 10px;
  }
  .stat {
    background: rgba(0, 0, 0, .2);
    border-radius: 10px; padding: 7px 8px; text-align: center;
  }
  .stat-k { font-size: .66rem; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-v { font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-s { font-size: .64rem; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Progress inside hero */
  .progress-wrap { margin-top: 10px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: .74rem; opacity: .92; margin-bottom: 4px; gap: 6px; }
  .bar { height: 7px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: #34d399; border-radius: 999px; transition: width .3s ease; }
  .hero-note { margin: 6px 0 0; font-size: .73rem; opacity: .92; line-height: 1.35; }

  /* Compact cards for Menu 1 & 2 */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .step {
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; font-size: .86rem; margin: 0;
  }
  .step-num {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent-text);
    display: inline-grid; place-items: center; font-size: .72rem; font-weight: 700; flex-shrink: 0;
  }

  /* Non-overflowing input row */
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: stretch;
  }
  .input-wrap { position: relative; width: 100%; }
  .inp {
    width: 100%; background: var(--surface-2); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 8px 36px 8px 10px; font: inherit; font-size: .88rem;
    font-variant-numeric: tabular-nums;
  }
  .inp:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .unit {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: .74rem; color: var(--muted); pointer-events: none;
  }
  .btn {
    background: var(--accent); color: #ffffff; border: 0;
    border-radius: 10px; padding: 8px 13px; font: inherit;
    font-size: .84rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn-block { width: 100%; margin-top: 8px; padding: 9px; }

  /* Quick chips */
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 7px; }
  .chip {
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 0; font: inherit; font-size: .72rem;
    cursor: pointer; text-align: center;
  }
  .chip:hover { color: var(--accent-text); background: var(--accent-soft); border-color: transparent; }

  /* Stepper */
  .stepper {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 2px; flex-shrink: 0;
  }
  .step-btn {
    width: 24px; height: 24px; border-radius: 6px; border: 0;
    background: var(--surface); color: var(--text); font: inherit;
    font-weight: 700; cursor: pointer; line-height: 1;
  }
  .step-val { min-width: 56px; text-align: center; font-size: .76rem; font-weight: 600; }

  .wk-list {
    display: grid; gap: 6px;
    max-height: 118px; overflow-y: auto;
  }
  .wk-row {
    display: grid;
    grid-template-columns: 78px 1fr;
    align-items: center;
    gap: 8px;
  }
  .wk-tag { font-size: .78rem; color: var(--muted); font-weight: 500; white-space: nowrap; }

  .toast { font-size: .75rem; text-align: center; min-height: 16px; color: var(--accent-text); font-weight: 500; }
  .toast.err { color: var(--danger); }

  footer {
    margin-top: auto; text-align: center; font-size: .7rem; color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<main class="app">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">🐷</div>
      <div>
        <h1>ระบบออมเงิน</h1>
        <p class="sub">ต่อยอดโค้ด C · รวม / เฉลี่ย / สูงสุด</p>
      </div>
    </div>
    <button id="resetBtn" class="ghost-btn" onclick="resetAll()">เริ่มใหม่</button>
  </header>

  <!-- 3. สรุปผลการออม + ความคืบหน้าเป้าหมาย (รวมในการ์ดเดียว) -->
  <section class="hero" aria-label="สรุปผลการออม">
    <div class="hero-top">
      <div>
        <div class="hero-label">ยอดออมสะสมทั้งหมด</div>
        <div class="hero-total" id="heroTotal">0.00 <small>บาท</small></div>
      </div>
      <span class="pill" id="heroWeeks">0 สัปดาห์</span>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-k">ยอดรวม</div>
        <div class="stat-v" id="stTotal">0.00</div>
        <div class="stat-s" id="stTotalSub">บาท</div>
      </div>
      <div class="stat">
        <div class="stat-k">เฉลี่ย/สัปดาห์</div>
        <div class="stat-v" id="stAvg">0.00</div>
        <div class="stat-s">บาท</div>
      </div>
      <div class="stat">
        <div class="stat-k">ออมสูงสุด</div>
        <div class="stat-v" id="stHigh">0.00</div>
        <div class="stat-s" id="stHighSub">บาท</div>
      </div>
    </div>

    <div class="progress-wrap" id="goalBox"></div>
  </section>

  <!-- 1. ตั้งเป้าหมายการออม -->
  <section class="card">
    <div class="card-head">
      <h2 class="step"><span class="step-num">1</span> ตั้งเป้าหมายการออม</h2>
    </div>
    <div class="row">
      <div class="input-wrap">
        <input id="goalInput" type="number" min="1" class="inp" placeholder="เช่น 5000">
        <span class="unit">บาท</span>
      </div>
      <button id="saveGoalBtn" class="btn" onclick="setGoal()">ตั้งเป้า</button>
    </div>
    <div class="chips">
      <button class="chip" onclick="quickGoal(1000)">1,000</button>
      <button class="chip" onclick="quickGoal(3000)">3,000</button>
      <button class="chip" onclick="quickGoal(5000)">5,000</button>
      <button class="chip" onclick="quickGoal(10000)">10,000</button>
    </div>
  </section>

  <!-- 2. บันทึกเงินออม -->
  <section class="card">
    <div class="card-head">
      <h2 class="step"><span class="step-num">2</span> บันทึกเงินออม</h2>
      <div class="stepper">
        <button class="step-btn" onclick="changeN(-1)" aria-label="ลด">−</button>
        <span class="step-val" id="nLabel">1 สัปดาห์</span>
        <button class="step-btn" onclick="changeN(1)" aria-label="เพิ่ม">+</button>
      </div>
    </div>
    <div id="weekInputs" class="wk-list"></div>
    <button id="addSavingsBtn" class="btn btn-block" onclick="addSavings()">+ บันทึกเงินออม</button>
  </section>

  <div id="msg" class="toast" role="status"></div>

  <footer>
    โค้ด Dev-C++: <a href="savings_tracker.c">savings_tracker.c</a>
  </footer>
</main>

<script>
let goal = 0, weekCount = 0, total = 0, highest = 0, hiWeek = 0, N = 1;
const KEY = "savings-simple-v1";
const fmt = n => n.toLocaleString("th-TH", {minimumFractionDigits: 2, maximumFractionDigits: 2});

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({goal, weekCount, total, highest, hiWeek})); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d){ ({goal=0, weekCount=0, total=0, highest=0, hiWeek=0} = d); }
  }catch(e){}
}

function setGoal(){
  const v = parseFloat(document.getElementById("goalInput").value);
  if(!(v >= 1)) return flash("กรุณากรอกจำนวนเงินเป้าหมายมากกว่า 0 บาท", true);
  goal = v; save(); render();
  flash(`ตั้งเป้าหมาย ${fmt(goal)} บาท เรียบร้อย ✓`);
}
function quickGoal(v){
  document.getElementById("goalInput").value = v;
  setGoal();
}

function changeN(delta){
  N = Math.min(20, Math.max(1, N + delta));
  document.getElementById("nLabel").textContent = `${N} สัปดาห์`;
  buildInputs();
}
function buildInputs(){
  let html = "";
  for(let i = 1; i <= N; i++){
    html += `<div class="wk-row">
      <span class="wk-tag">สัปดาห์ที่ ${weekCount + i}</span>
      <div class="input-wrap">
        <input type="number" min="0" class="inp wk" placeholder="0.00" onkeydown="if(event.key==='Enter')addSavings()">
        <span class="unit">บาท</span>
      </div>
    </div>`;
  }
  document.getElementById("weekInputs").innerHTML = html;
}
function addSavings(){
  const inputs = [...document.querySelectorAll(".wk")];
  for(const el of inputs){
    if(el.value === "" || !(parseFloat(el.value) >= 0)){
      el.focus();
      return flash("กรุณากรอกจำนวนเงินให้ครบทุกช่อง", true);
    }
  }
  for(const el of inputs){
    const amount = parseFloat(el.value);
    weekCount++;
    total += amount;
    if(amount > highest){ highest = amount; hiWeek = weekCount; }
  }
  save();
  const added = inputs.length;
  N = 1;
  document.getElementById("nLabel").textContent = "1 สัปดาห์";
  render();
  flash(`บันทึกเพิ่ม ${added} สัปดาห์แล้ว ✓`);
}

function resetAll(){
  if(!confirm("ต้องการเริ่มใหม่และล้างข้อมูลทั้งหมดใช่ไหม?")) return;
  goal = 0; weekCount = 0; total = 0; highest = 0; hiWeek = 0; N = 1;
  save(); render();
  flash("ล้างข้อมูลเรียบร้อย");
}
function flash(t, err){
  const m = document.getElementById("msg");
  m.textContent = t;
  m.className = "toast" + (err ? " err" : "");
  clearTimeout(flash._t);
  flash._t = setTimeout(() => m.textContent = "", 3000);
}

function render(){
  document.getElementById("goalInput").value = goal || "";
  document.getElementById("heroTotal").innerHTML = `${fmt(total)} <small>บาท</small>`;
  document.getElementById("heroWeeks").textContent = `${weekCount} สัปดาห์`;

  const average = weekCount ? total / weekCount : 0;
  document.getElementById("stTotal").textContent = fmt(total);
  document.getElementById("stAvg").textContent = fmt(average);
  document.getElementById("stHigh").textContent = fmt(highest);
  document.getElementById("stHighSub").textContent = hiWeek ? `สัปดาห์ที่ ${hiWeek}` : "บาท";

  const box = document.getElementById("goalBox");
  if(goal > 0){
    const remaining = goal - total;
    const percent = Math.min(100, total / goal * 100);
    let note;
    if(remaining <= 0){
      note = "🎉 ยินดีด้วย! ออมเงินครบตามเป้าหมายแล้ว";
    } else if(average > 0){
      const weeksLeft = Math.ceil(remaining / average);
      note = `ขาดอีก ${fmt(remaining)} บาท · คาดว่าครบใน ${weeksLeft} สัปดาห์`;
    } else {
      note = `ขาดอีก ${fmt(remaining)} บาท`;
    }
    box.innerHTML = `
      <div class="progress-meta">
        <span>🎯 เป้าหมาย ${fmt(goal)} บาท</span>
        <b>${percent.toFixed(1)}%</b>
      </div>
      <div class="bar"><div style="width:${percent}%"></div></div>
      <p class="hero-note">${note}</p>`;
  } else {
    box.innerHTML = `<p class="hero-note">💡 ตั้งเป้าหมายในข้อ 1 เพื่อดูความคืบหน้า</p>`;
  }
  buildInputs();
}

load();
render();
</script>
</body>
</html>
